name: DevOps CI/CD Pipeline (AWS ECR & EC2 Deployment)

# ==============================================================================
# DevOps Engineering Training Program - Master CI/CD Workflow
# ==============================================================================
# Pipeline Overview:
# ┌─────────────────────────────────────────────────────────────┐
# │                   Stage 1: Code Quality                     │
# │                     (Linter / Oxlint)                       │
# └──────────────────────────────┬──────────────────────────────┘
#                                │ (passes)
#                                ▼
# ┌─────────────────────────────────────────────────────────────┐
# │                   Stage 2: Automated Tests                  │
# │                    (Vitest Unit Testing)                    │
# └──────────────────────────────┬──────────────────────────────┘
#                                │ (passes)
#                ┌───────────────┴───────────────┐
#                ▼                               ▼
# ┌─────────────────────────────┐ ┌─────────────────────────────┐
# │  Stage 3: Build & Package   │ │   Stage 4: Security Audit   │
# │     (Vite dist/ bundle)     │ │        (npm audit)          │
# └──────────────┬──────────────┘ └──────────────┬──────────────┘
#                │                               │
#                ▼                               │
# ┌─────────────────────────────┐                │
# │ Stage 5: Container Validation│               │
# │     (Docker Build Check)    │                │
# └──────────────┬──────────────┘                │
#                └───────────────┬───────────────┘
#                                │ (all passed on 'main')
#                                ▼
# ┌─────────────────────────────────────────────────────────────┐
# │            Stage 6: Deploy to AWS ECR & EC2 Server          │
# │   • Tag & Push to ECR: devops_program_cc_fe                 │
# │   • Run Container on EC2: http://13.210.209.34              │
# └─────────────────────────────────────────────────────────────┘
# ==============================================================================

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    # Allows instructors and students to manually trigger this pipeline

permissions:
  contents: read

concurrency:
  group: "production-deploy"
  cancel-in-progress: false

jobs:
  # ============================================================================
  # JOB 1: CODE QUALITY & STATIC ANALYSIS
  # ============================================================================
  code-quality:
    name: "1. Code Quality & Lint"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: ⚙️ Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Clean Dependencies (npm ci)
        run: npm ci

      - name: 🔍 Run Static Linter (Oxlint)
        run: npm run lint

  # ============================================================================
  # JOB 2: AUTOMATED UNIT TESTS
  # ============================================================================
  unit-tests:
    name: "2. Automated Unit Tests"
    needs: code-quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🧪 Execute Unit Test Suite
        run: npm run test:run

  # ============================================================================
  # JOB 3: BUILD & ARTIFACT PACKAGING
  # ============================================================================
  build-and-package:
    name: "3. Build & Package Artifact"
    needs: unit-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Compile Production Bundle (Vite Build)
        run: npm run build

      - name: 📤 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ============================================================================
  # JOB 4: DEVSECOPS & DEPENDENCY SECURITY AUDIT
  # ============================================================================
  security-audit:
    name: "4. DevSecOps Security Audit"
    needs: unit-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 🛡️ Audit Dependencies for CVEs
        run: npm audit --audit-level=high

  # ============================================================================
  # JOB 5: DOCKER CONTAINER VERIFICATION
  # ============================================================================
  docker-verification:
    name: "5. Docker Container Build Check"
    needs: build-and-package
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔨 Build Docker Image
        run: |
          docker build \
            --tag devops-frontend:test \
            --file frontend/Dockerfile \
            frontend/

      - name: 🩺 Smoke Test Container Startup
        run: |
          docker run -d --name test-container -p 8080:80 devops-frontend:test
          sleep 3
          curl --fail http://localhost:8080/healthz || exit 1
          docker stop test-container
          docker rm test-container

  # ============================================================================
  # JOB 6: DEPLOY TO AWS ECR & EC2 LIVE SERVER
  # ============================================================================
  # Target Architecture:
  #   - Target Host: AWS EC2 Ubuntu (IP: 13.210.209.34)
  #   - AWS ECR Registry: 322473970206.dkr.ecr.ap-southeast-2.amazonaws.com
  #   - ECR Repository: devops_program_cc_fe
  #   - Web Port: 80 (Nginx Alpine Container)
  # Note on Sensitive Information:
  #   Initial values are pre-configured below so the pipeline runs out-of-the-box.
  #   When moving to GitHub Secrets, simply add EC2_SSH_KEY_B64, EC2_HOST,
  #   EC2_USER, ECR_REGISTRY in GitHub Settings -> Secrets -> Actions!
  # ============================================================================
  deploy-to-aws:
    name: "6. Deploy to AWS ECR & EC2"
    needs: [build-and-package, security-audit, docker-verification]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    env:
      # Target server connection details (defaults can be overridden by GitHub Secrets)
      EC2_HOST: ${{ secrets.EC2_HOST || '13.210.209.34' }}
      EC2_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
      ECR_REGISTRY: ${{ secrets.ECR_REGISTRY || '322473970206.dkr.ecr.ap-southeast-2.amazonaws.com' }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY || 'devops_program_cc_fe' }}
      AWS_REGION: ${{ secrets.AWS_REGION || 'ap-southeast-2' }}
      # Base64-encoded SSH PEM key (safe for git push protection)
      EC2_SSH_KEY_B64: ${{ secrets.EC2_SSH_KEY_B64 || '' }}

    steps:
      - name: 📥 Checkout Repository Source
        uses: actions/checkout@v4

      - name: 📥 Download Verified Production Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: 🔑 Configure SSH Deployment Key
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY_B64" | base64 -d > ~/.ssh/deploy_key.pem
          chmod 600 ~/.ssh/deploy_key.pem

      - name: 📦 Sync Built Artifacts & Configs to EC2
        run: |
          echo "📁 Creating remote application directory on $EC2_HOST..."
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key.pem $EC2_USER@$EC2_HOST "mkdir -p ~/app/frontend"

          echo "🚀 Copying compiled production bundle and Nginx configs to EC2..."
          scp -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key.pem -r frontend/dist frontend/nginx.conf $EC2_USER@$EC2_HOST:~/app/frontend/

      - name: 🐳 Build, Push to AWS ECR & Launch Container on EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key.pem $EC2_USER@$EC2_HOST bash << 'EOF'
            set -e
            cd ~/app/frontend

            echo "🔑 Authenticating with AWS ECR (Region: ap-southeast-2)..."
            aws ecr get-login-password --region ap-southeast-2 | docker login --username AWS --password-stdin 322473970206.dkr.ecr.ap-southeast-2.amazonaws.com

            echo "🔨 Generating production container descriptor..."
            cat << 'DOCKERFILE' > Dockerfile.deploy
            FROM nginx:1.27-alpine
            RUN rm -rf /usr/share/nginx/html/*
            COPY dist /usr/share/nginx/html
            COPY nginx.conf /etc/nginx/conf.d/default.conf
            EXPOSE 80
            HEALTHCHECK --interval=30s --timeout=3s --start-period=5s --retries=3 \
              CMD wget --quiet --tries=1 --spider http://localhost/healthz || exit 1
            CMD ["nginx", "-g", "daemon off;"]
            DOCKERFILE

            IMAGE_URI="322473970206.dkr.ecr.ap-southeast-2.amazonaws.com/devops_program_cc_fe:latest"

            echo "🐳 Building Docker image for production release..."
            docker build -t "$IMAGE_URI" -f Dockerfile.deploy .

            echo "⬆️ Pushing Docker image to AWS ECR repository..."
            docker push "$IMAGE_URI"

            echo "🛑 Stopping and removing previous container..."
            docker stop devops-web 2>/dev/null || true
            docker rm devops-web 2>/dev/null || true

            echo "🚀 Launching new container on port 80..."
            docker run -d \
              --name devops-web \
              --restart always \
              -p 80:80 \
              "$IMAGE_URI"

            echo "🩺 Running container healthcheck probe..."
            sleep 3
            curl -f http://localhost/healthz || exit 1
            echo "✅ Container is active and responding with HTTP 200 OK!"
          EOF

      - name: 🎉 Deployment Success Summary
        run: |
          echo "=========================================================="
          echo "🎉 DEPLOYMENT TO AWS SUCCESSFUL!"
          echo "AWS ECR Image: 322473970206.dkr.ecr.ap-southeast-2.amazonaws.com/devops_program_cc_fe:latest"
          echo "Live Website URL: http://13.210.209.34"
          echo "=========================================================="
