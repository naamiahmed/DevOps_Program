name: DevOps CI/CD Pipeline (AWS ECR & EC2 Deployment)

# ==============================================================================
# DevOps Engineering Training Program - Master CI/CD Workflow
# ==============================================================================
# Pipeline Overview:
# ┌─────────────────────────────────────────────────────────────┐
# │                   Stage 1: Code Quality                     │
# │                     (Linter / Oxlint)                       │
# └──────────────────────────────┬──────────────────────────────┘
#                                │ (passes)
#                                ▼
# ┌─────────────────────────────────────────────────────────────┐
# │                   Stage 2: Automated Tests                  │
# │                    (Vitest Unit Testing)                    │
# └──────────────────────────────┬──────────────────────────────┘
#                                │ (passes)
#                ┌───────────────┴───────────────┐
#                ▼                               ▼
# ┌─────────────────────────────┐ ┌─────────────────────────────┐
# │  Stage 3: Build & Package   │ │   Stage 4: Security Audit   │
# │     (Vite dist/ bundle)     │ │        (npm audit)          │
# └──────────────┬──────────────┘ └──────────────┬──────────────┘
#                │                               │
#                ▼                               │
# ┌─────────────────────────────┐                │
# │ Stage 5: Container Validation│               │
# │     (Docker Build Check)    │                │
# └──────────────┬──────────────┘                │
#                └───────────────┬───────────────┘
#                                │ (all passed on 'main')
#                                ▼
# ┌─────────────────────────────────────────────────────────────┐
# │            Stage 6: Deploy to AWS ECR & EC2 Server          │
# │   • Authenticate, Tag & Push to Amazon ECR                  │
# │   • Launch Live Production Container via SSH                │
# └─────────────────────────────────────────────────────────────┘
# ==============================================================================

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    # Allows instructors and students to manually trigger this pipeline

permissions:
  contents: read

concurrency:
  group: "production-deploy"
  cancel-in-progress: false

jobs:
  # ============================================================================
  # JOB 1: CODE QUALITY & STATIC ANALYSIS
  # ============================================================================
  code-quality:
    name: "1. Code Quality & Lint"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: ⚙️ Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Clean Dependencies (npm ci)
        run: npm ci

      - name: 🔍 Run Static Linter (Oxlint)
        run: npm run lint

  # ============================================================================
  # JOB 2: AUTOMATED UNIT TESTS
  # ============================================================================
  unit-tests:
    name: "2. Automated Unit Tests"
    needs: code-quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🧪 Execute Unit Test Suite
        run: npm run test:run

  # ============================================================================
  # JOB 3: BUILD & ARTIFACT PACKAGING
  # ============================================================================
  build-and-package:
    name: "3. Build & Package Artifact"
    needs: unit-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Compile Production Bundle (Vite Build)
        run: npm run build

      - name: 📤 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ============================================================================
  # JOB 4: DEVSECOPS & DEPENDENCY SECURITY AUDIT
  # ============================================================================
  security-audit:
    name: "4. DevSecOps Security Audit"
    needs: unit-tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 🛡️ Audit Dependencies for CVEs
        run: npm audit --audit-level=high

  # ============================================================================
  # JOB 5: DOCKER CONTAINER VERIFICATION
  # ============================================================================
  docker-verification:
    name: "5. Docker Container Build Check"
    needs: build-and-package
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔨 Build Docker Image
        run: |
          docker build \
            --tag devops-frontend:test \
            --file frontend/Dockerfile \
            frontend/

      - name: 🩺 Smoke Test Container Startup
        run: |
          docker run -d --name test-container -p 8080:80 devops-frontend:test
          sleep 3
          curl --fail http://localhost:8080/healthz || exit 1
          docker stop test-container
          docker rm test-container

  # ============================================================================
  # JOB 6: DEPLOY TO AWS ECR & EC2 LIVE SERVER
  # ============================================================================
  # Purpose:
  #   Authenticates to Amazon ECR, builds & pushes the production Docker image,
  #   and connects to the AWS EC2 server via SSH to launch the container.
  #
  # Security Best Practice:
  #   All sensitive credentials (SSH key, host IP, ECR registry, region, port)
  #   are securely injected via GitHub Actions Repository Secrets.
  # ============================================================================
  deploy-to-aws:
    name: "6. Deploy to AWS ECR & EC2"
    needs: [build-and-package, security-audit, docker-verification]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}
      ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      APP_PORT: ${{ secrets.APP_PORT || '80' }}

    steps:
      - name: 📥 Checkout Repository Source
        uses: actions/checkout@v4

      - name: 📥 Download Verified Production Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: 🔑 Configure SSH Deployment Key
        run: |
          mkdir -p ~/.ssh
          if echo "$EC2_SSH_KEY" | grep -q "BEGIN RSA PRIVATE KEY"; then
            echo "$EC2_SSH_KEY" > ~/.ssh/deploy_key.pem
          else
            echo "$EC2_SSH_KEY" | base64 -d > ~/.ssh/deploy_key.pem
          fi
          chmod 600 ~/.ssh/deploy_key.pem

      - name: 📦 Sync Built Artifacts & Configs to EC2
        run: |
          echo "📁 Creating remote application directory on target host..."
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key.pem $EC2_USER@$EC2_HOST "mkdir -p ~/app/frontend"

          echo "🚀 Copying compiled production bundle, Nginx configs, and Dockerfile to EC2..."
          scp -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key.pem -r frontend/dist frontend/nginx.conf frontend/Dockerfile.deploy $EC2_USER@$EC2_HOST:~/app/frontend/

      - name: 🐳 Build, Push to AWS ECR & Launch Container on EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key.pem $EC2_USER@$EC2_HOST \
            "ECR_REGISTRY='$ECR_REGISTRY' ECR_REPOSITORY='$ECR_REPOSITORY' AWS_REGION='$AWS_REGION' APP_PORT='$APP_PORT' bash" << 'EOF'
            set -e
            cd ~/app/frontend

            echo "🔑 Authenticating with AWS ECR (Region: $AWS_REGION)..."
            aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

            IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:latest"

            echo "🐳 Building Docker image for production release..."
            docker build --no-cache -t "$IMAGE_URI" -f Dockerfile.deploy .

            echo "⬆️ Pushing Docker image to AWS ECR repository..."
            docker push "$IMAGE_URI"

            echo "🛑 Stopping and removing previous container..."
            docker stop devops-web 2>/dev/null || true
            docker rm devops-web 2>/dev/null || true

            echo "🚀 Launching new container on port $APP_PORT..."
            docker run -d \
              --name devops-web \
              --restart always \
              -p ${APP_PORT}:80 \
              "$IMAGE_URI"

            echo "🩺 Running container healthcheck probe..."
            sleep 3
            curl -f http://localhost/healthz || exit 1
            echo "✅ Container is active and responding with HTTP 200 OK!"
          EOF

      - name: 🎉 Deployment Success Summary
        run: |
          echo "=========================================================="
          echo "🎉 DEPLOYMENT TO AWS SUCCESSFUL!"
          echo "AWS ECR Image: $ECR_REGISTRY/$ECR_REPOSITORY:latest"
          echo "Live Website URL: http://$EC2_HOST:$APP_PORT"
          echo "=========================================================="
