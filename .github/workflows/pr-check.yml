name: Pull Request Fast Feedback

# ==============================================================================
# DevOps Engineering Training Program - PR Quality Gate
# ==============================================================================
# Purpose:
#   When a student opens a Pull Request (PR) against 'main', this workflow
#   runs fast static analysis, unit tests, and build validation in parallel.
#   It prevents broken code from ever being merged into the master codebase.
# ==============================================================================

on:
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/**'

jobs:
  pr-validation:
    name: "PR Gate: Quality, Tests & Build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 📥 Checkout Pull Request Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 Check Code Formatting & Syntax
        run: npm run lint

      - name: 🧪 Run Automated Tests
        run: npm run test:run

      - name: 🏗️ Verify Production Build Compiles
        run: npm run build

      - name: 🎉 PR Verification Complete
        run: echo "All quality gates passed! This PR is safe for review and merging."
